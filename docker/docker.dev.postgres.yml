name: tinycloud-dev-db

services:
  db:
    image: postgres:17-alpine
    container_name: tinycloud-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tinycloud
      POSTGRES_PASSWORD: tinycloud
      POSTGRES_DB: tinycloud
    ports:
      # 5433 avoids clashing with a local Postgres on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - tinycloud-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinycloud -d tinycloud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tinycloud-dev-db-data:
